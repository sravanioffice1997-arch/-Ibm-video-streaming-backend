<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Live Stream Test Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 40px auto; }
  video { width: 100%; background: #000; }
  input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
  <h2>HLS Test Player</h2>
  <p>Paste the <code>hlsMasterUrl</code> returned by <code>GET /api/channels/:id</code> once the channel is live.</p>
  <input id="url" placeholder="http://localhost:8000/live/&lt;streamKey&gt;/master.m3u8" />
  <button onclick="load()">Load Stream</button>
  <video id="video" controls autoplay></video>

  <script>
    function load() {
      const url = document.getElementById("url").value;
      const video = document.getElementById("video");
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url; // Safari native HLS
      }
    }
  </script>
</body>
</html>
